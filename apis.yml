aid: goodvest
name: Goodvest
description: 'Goodvest is a French mission-driven fintech (entreprise à mission) based in Paris
  that sells climate-aligned retail savings and investment products: an ISR assurance-vie
  (Goodvie, insured by Generali), a euro-fund assurance-vie (Goodlife, insured by Spirica), a
  Plan Épargne Retraite, a minors'' contract, a green Livret d''Épargne backed by CFCAL-Banque,
  and a Goodvest First private-management tier covering private equity, sustainable real estate,
  green infrastructure and structured products. Portfolios are screened against a published
  seven-filter methodology aligned with the Paris Agreement — fossil-fuel exclusion,
  carbon-footprint and biodiversity analysis — and every unit-linked support carries EU SFDR
  Article 8 or Article 9 sustainability disclosures. Goodvest SAS is registered with ORIAS
  (20007544) as an insurance broker and non-exclusive banking intermediary, is a member of
  ANACOFI-CIF, and is supervised by the ACPR and the AMF. It publishes a complete public fee
  schedule (0% entry, exit, arbitrage and performance fees) but no public API, SDK, webhook
  surface or developer portal of any kind.'
