note: >-
  Goodvest has no machine-readable API contract, so there is nothing to derive technical
  conformance from. What it DOES publish is a full regulatory and sustainability-disclosure
  posture — French insurance-intermediation and financial-advice registrations, plus EU
  SFDR Article 8/9 fund classifications with per-fund sustainability documents. Those are
  recorded here as the honest conformance surface for a regulated French wealth-management
  provider. Every technical/API standard below is `conforms: false` because no API exists,
  not because it was tested and failed.
